<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colgrups</title>
    <style>
  
        table{
            width: 600px;
            border-collapse: collapse;
            font-family: Arial, Helvetica, sans-serif;
        }

        td, th{
            width: 200px;
            border: 1px solid black;
            text-align: center;
            background-color: white;
        }
        col.cnome{
            background-color: yellow;
        }

    </style>
</head>
<body>
    
    <table>
        <colgroup>
            <col class="cnome">
            <col>
            <col>
            <col>
        </colgroup>

        <thead>
            <tr>
                <th scope="col">nome</th>
                <th scope="col">idade</th>
                <th scope="col">sexo</th>
                <th scope="col">profissão</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Matheus</td>
                <td>20</td>
                <td>Masculino</td>
                <td>Programador</td>
            </tr>
            <tr>
                <td>Maria</td>
                <td>22</td>
                <td>Feminino</td>
                <td>Designer</td>
            </tr>
            <tr>
                <td>João</td>
                <td>25</td>
                <td>Masculino</td>
                <td>Engenheiro</td>
            </tr>
        </tbody>
    </table>


</body>
</html>
